<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>SPR Techforge Management</title>
    <meta name="description" content="SPR Techforge — software testing training, free live seminars and career kickstart events for freshers and career switchers." />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Link previews (WhatsApp, LinkedIn, Facebook, Google). Scrapers do not run
         JavaScript, so these are static and site-wide; the image is served from
         the production domain so previews work no matter which host the link
         points at. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPR Techforge" />
    <meta property="og:title" content="SPR Techforge — Free Software Testing Seminars & Training" />
    <meta property="og:description" content="Launch your IT career with software testing. Free live seminars, real testing demos and career Q&A from SPR Techforge." />
    <meta property="og:image" content="https://sprtechforge.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SPR Techforge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SPR Techforge — Free Software Testing Seminars & Training" />
    <meta name="twitter:description" content="Launch your IT career with software testing. Free live seminars, real testing demos and career Q&A from SPR Techforge." />
    <meta name="twitter:image" content="https://sprtechforge.com/og-image.png" />

    <!-- Start the Firestore/Fonts connections while the JS bundle is still downloading -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter is loaded WITHOUT blocking first paint: the stylesheet is fetched
         as a preload and switched on when it arrives; text renders in the
         system font meanwhile (font-display: swap). The old @import inside the
         CSS bundle held a blank screen for 2+ seconds on slow connections. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>

    <!-- Event page prefetch. When the URL is a public event link, ask Firestore
         for that event NOW — in parallel with the JS download, roughly 1.5 s
         before React could. A text/plain POST is a CORS "simple request", so
         there is no preflight round trip. events/services/eventsPublicDb.ts
         picks the promise up; if anything is off it just queries normally.
         The two %VITE_...% values are filled in at build time by Vite. -->
    <script>
      (function () {
        try {
          var m = /^#\/events\/([a-z0-9-]+)\/?(\?.*)?$/.exec(location.hash || '');
          if (!m || m[1] === 'manage') return;
          var pid = '%VITE_FIREBASE_PROJECT_ID%', key = '%VITE_FIREBASE_API_KEY%';
          if (!pid || !key || pid.charAt(0) === '%' || key.charAt(0) === '%') return;
          var url = 'https://firestore.googleapis.com/v1/projects/' + pid + '/databases/(default)/documents:runQuery?key=' + key;
          var body = JSON.stringify({ structuredQuery: { from: [{ collectionId: 'events_events' }], where: { fieldFilter: { field: { fieldPath: 'slug' }, op: 'EQUAL', value: { stringValue: m[1] } } }, limit: 1 } });
          window.__SPR_EVENT_PREFETCH = {
            slug: m[1],
            projectId: pid,
            promise: fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body }).then(function (r) { return r.ok ? r.json() : null; })
          };
        } catch (e) { /* prefetch is best-effort */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
