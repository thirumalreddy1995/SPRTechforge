<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPR TechForge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- GitHub Pages serves this for any path that has no file. Event share
         links look like /e/<slug>/ — a page that exists once the site has been
         rebuilt after the event was published. Until then, or for any other
         unknown path, send the visitor to the right place inside the app. -->
    <script>
      (function () {
        var m = location.pathname.match(/^[/]e[/]([A-Za-z0-9-]+)[/]?$/);
        var q = location.search || '';
        if (m) location.replace('/#/events/' + m[1] + q);
        else if (/^[/]webinar[/]?$/.test(location.pathname)) location.replace('/#/events' + q);
        else location.replace('/');
      })();
    </script>
    <style>body{font-family:Inter,Arial,sans-serif;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}a{color:#93c5fd}</style>
  </head>
  <body>
    <p>Taking you to SPR TechForge… <a href="/">Continue</a></p>
  </body>
</html>
