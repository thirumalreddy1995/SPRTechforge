name: Deploy QA to Firebase Hosting

on:
  push:
    branches:
      - QA

permissions:
  contents: read
  checks: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Safety guard: refuse to build if QA Firebase secrets are missing.
      # Without this check the build would silently fall back to the production
      # Firebase project (the hardcoded fallback in services/cloud.ts) and QA
      # traffic would write to the production database.
      - name: Verify QA secrets are configured
        env:
          QA_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_QA }}
          QA_API_KEY: ${{ secrets.FIREBASE_API_KEY_QA }}
          QA_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QA }}
        run: |
          missing=0
          if [ -z "$QA_PROJECT_ID" ]; then echo "::error::FIREBASE_PROJECT_ID_QA is not set"; missing=1; fi
          if [ -z "$QA_API_KEY" ]; then echo "::error::FIREBASE_API_KEY_QA is not set"; missing=1; fi
          if [ -z "$QA_SERVICE_ACCOUNT" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT_QA is not set"; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Refusing to deploy QA: required secrets are missing. See SETUP-ENVIRONMENTS.md."
            exit 1
          fi

      - name: Build project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY_QA }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_QA }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_QA }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_QA }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID_QA }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_QA }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID_QA }}
        run: npm run build

      - name: Deploy to Firebase Hosting (QA)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QA }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_QA }}
          channelId: live

      # Cloud Functions deploy. Requires the Firebase project to be on the
      # Blaze plan. If billing isn't enabled yet this step fails with a clear
      # error but hosting deploy above will already have shipped the frontend.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
          FIREBASE_PROJECT_ID_QA: ${{ secrets.FIREBASE_PROJECT_ID_QA }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QA }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID_QA" --non-interactive --force
